<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    window.SITE_REVISION = new URLSearchParams(window.location.search).get('v') || Date.now().toString(36);
    window.versionedAssetUrl = path => {
      const assetUrl = new URL(path, window.location.href);
      assetUrl.searchParams.set('v', window.SITE_REVISION);
      return assetUrl.href;
    };
    window.loadVersionedStyles = paths => paths.forEach(path => {
      const stylesheet = document.createElement('link');
      stylesheet.rel = 'stylesheet';
      stylesheet.href = window.versionedAssetUrl(path);
      document.head.appendChild(stylesheet);
    });
    window.loadVersionedScripts = paths => paths.forEach(path => {
      document.write(`<script src="${window.versionedAssetUrl(path)}"><\/script>`);
    });
    fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' })
      .then(response => response.ok ? response.json() : null)
      .then(build => {
        if (!build?.revision) return;

        const currentUrl = new URL(window.location.href);
        if (currentUrl.searchParams.get('v') !== build.revision) {
          currentUrl.searchParams.set('v', build.revision);
          window.location.replace(currentUrl.href);
        }
      })
      .catch(() => {});
  </script>
  <script>
    try {
      const linkedTheme = new URLSearchParams(location.search).get('theme');
      const savedTheme = linkedTheme || localStorage.getItem('theme');
      if (linkedTheme) localStorage.setItem('theme', linkedTheme);
      if (savedTheme === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch {}
  </script>
  <title>Zuri Ye - About</title>
  <script>
    window.loadVersionedStyles([
      'css/variables.css',
      'css/base.css',
      'css/components.css',
      'css/pages.css'
    ]);
  </script>
</head>
<body>

  <nav class="global-nav">
    <ul class="nav-links">
      <li><a href="index.html" class="retro-press">home</a></li>
      <li><a href="projects.html" class="retro-press">projects</a></li>
      <li><a href="about.html" class="retro-press">about</a></li>
    </ul>
  </nav>

  <main>
    <div class="about-block-container" id="about-container">
      <!-- Blocks will be injected here by JS -->
    </div>
  </main>

  <script>
    window.loadVersionedScripts(['js/config.js', 'js/interactions.js', 'data/about.js']);
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('about-container');
      
      siteAbout.forEach(block => {
        if (block.type === 'text') {
          const div = document.createElement('div');
          div.className = 'about-text-block';
          
          div.innerHTML = `
            ${block.title ? `<h3>${block.title}</h3>` : ''}
            <div class="text-content">${block.content}</div>
          `;
          container.appendChild(div);
        } else if (block.type === 'code') {
          const div = document.createElement('div');
          div.className = 'about-code-wrapper';
          
          div.innerHTML = `
            <div class="about-code-header">.yaml</div>
            <div class="about-code-block">
              <div class="code-content">${block.content}</div>
            </div>
          `;
          container.appendChild(div);
        }
      });

      renderLineNumbers();
    });
  </script>
</body>
</html>
