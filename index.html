<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zuri Ye - Home</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <nav class="global-nav">
    <ul class="nav-links">
      <li><a href="index.html" class="retro-press">home</a></li>
      <li><a href="projects.html" class="retro-press">projects</a></li>
      <li><a href="about.html" class="retro-press">about</a></li>
    </ul>
  </nav>

  <main class="home-layout">
    
    <div class="splash-container" id="splash-container">
      <img src="assets/images/404splash.png" alt="404 Splash" class="splash-img">
      <!-- Pokémon Sprites -->
      <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/purrloin.gif" alt="Purrloin" class="sprite sprite-bw" id="sprite-purrloin">
      <img src="https://img.pokemondb.net/sprites/black-white/anim/back-normal/meowth.gif" alt="Meowth" class="sprite sprite-bw" id="sprite-meowth">
      <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/skitty.gif" alt="Skitty" class="sprite sprite-bw" id="sprite-skitty">
    </div>

    <h1 class="home-name">ZURI YE</h1>

    <a href="assets/resume.pdf" class="btn-primary retro-press" download>RESUME</a>

  </main>

  <script src="js/config.js"></script>
  <script src="js/interactions.js"></script>
  <script>
    // Apply configuration positions to sprites
    document.addEventListener('DOMContentLoaded', () => {
      const applySpriteConfig = (id, configKey) => {
        const el = document.getElementById(id);
        if (el && siteConfig.sprites[configKey]) {
          Object.assign(el.style, siteConfig.sprites[configKey]);
        }
      };

      applySpriteConfig('sprite-purrloin', 'purrloin');
      applySpriteConfig('sprite-meowth', 'meowth');
      applySpriteConfig('sprite-skitty', 'skitty');
    });
  </script>
</body>
</html>
