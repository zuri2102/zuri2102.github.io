<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    window.SITE_REVISION = new URLSearchParams(window.location.search).get('v') || Date.now().toString(36);
    window.versionedAssetUrl = path => {
      const assetUrl = new URL(path, window.location.href);
      assetUrl.searchParams.set('v', window.SITE_REVISION);
      return assetUrl.href;
    };
    window.loadVersionedStyles = paths => paths.forEach(path => {
      document.write(`<link rel="stylesheet" href="${window.versionedAssetUrl(path)}">`);
    });
    window.loadVersionedScripts = paths => paths.forEach(path => {
      document.write(`<script src="${window.versionedAssetUrl(path)}"><\/script>`);
    });
    fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' })
      .then(response => response.ok ? response.json() : null)
      .then(build => {
        if (!build?.revision) return;

        const currentUrl = new URL(window.location.href);
        if (currentUrl.searchParams.get('v') !== build.revision) {
          currentUrl.searchParams.set('v', build.revision);
          window.location.replace(currentUrl.href);
        }
      })
      .catch(() => {});
  </script>

  <script>
    try {
      const linkedTheme = new URLSearchParams(location.search).get('theme');
      const savedTheme = linkedTheme || localStorage.getItem('theme');
      if (linkedTheme) localStorage.setItem('theme', linkedTheme);
      if (savedTheme === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch {}
  </script>

  <script>
    // Apply configuration positions to sprites
    document.addEventListener('DOMContentLoaded', () => {
      const applySpriteConfig = (id, configKey) => {
        const el = document.getElementById(id);
        if (el && siteConfig.sprites[configKey]) {
          Object.assign(el.style, siteConfig.sprites[configKey]);
        }
      };

      applySpriteConfig('sprite-purrloin', 'purrloin');
      applySpriteConfig('sprite-meowth', 'meowth');
      applySpriteConfig('sprite-skitty', 'skitty');
      document.getElementById('splash-container').style.removeProperty('visibility');
    });
  </script>
