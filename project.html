<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    window.SITE_REVISION = new URLSearchParams(window.location.search).get('v') || Date.now().toString(36);
    window.versionedAssetUrl = path => {
      const assetUrl = new URL(path, window.location.href);
      assetUrl.searchParams.set('v', window.SITE_REVISION);
      return assetUrl.href;
    };
    window.loadVersionedStyles = paths => paths.forEach(path => {
      const stylesheet = document.createElement('link');
      stylesheet.rel = 'stylesheet';
      stylesheet.href = window.versionedAssetUrl(path);
      document.head.appendChild(stylesheet);
    });
    window.loadVersionedScripts = paths => paths.forEach(path => {
      document.write(`<script src="${window.versionedAssetUrl(path)}"><\/script>`);
    });
    fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' })
      .then(response => response.ok ? response.json() : null)
      .then(build => {
        if (!build?.revision) return;

        const currentUrl = new URL(window.location.href);
        if (currentUrl.searchParams.get('v') !== build.revision) {
          currentUrl.searchParams.set('v', build.revision);
          window.location.replace(currentUrl.href);
        }
      })
      .catch(() => {});
  </script>
  <script>
    try {
      const linkedTheme = new URLSearchParams(location.search).get('theme');
      const savedTheme = linkedTheme || localStorage.getItem('theme');
      if (linkedTheme) localStorage.setItem('theme', linkedTheme);
      if (savedTheme === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch {}
  </script>
  <title>Zuri Ye - Project</title>
  <script>
    window.loadVersionedStyles([
      'css/variables.css',
      'css/base.css',
      'css/components.css',
      'css/pages.css'
    ]);
  </script>
</head>
<body>

  <nav class="global-nav">
    <ul class="nav-links">
      <li><a href="index.html" class="retro-press">home</a></li>
      <li><a href="projects.html" class="retro-press">projects</a></li>
      <li><a href="about.html" class="retro-press">about</a></li>
    </ul>
  </nav>

  <main class="project-detail-layout">
    <a href="projects.html" class="btn-back retro-press">&lt; back</a>
    
    <h1 class="project-title" id="project-title">Loading...</h1>
    
    <div class="project-content-box" id="project-content">
      <!-- Project HTML content from JSON will be injected here -->
    </div>
  </main>

  <script>
    window.loadVersionedScripts(['js/config.js', 'js/interactions.js', 'data/projects.js']);
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('id');
      
      if (!projectId) {
        document.getElementById('project-title').textContent = "Project Not Found";
        return;
      }

      const project = siteProjects.find(p => p.id === projectId);
      if (project) {
        document.title = `Zuri Ye - ${project.title}`;
        document.getElementById('project-title').textContent = project.title;
        document.getElementById('project-content').innerHTML = project.content;
        versionLocalAssets(document.getElementById('project-content'));
      } else {
        document.getElementById('project-title').textContent = "Project Not Found";
      }
    });
  </script>
</body>
</html>
