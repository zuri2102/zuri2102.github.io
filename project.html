<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zuri Ye - Project</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <nav class="global-nav">
    <ul class="nav-links">
      <li><a href="index.html" class="retro-press">home</a></li>
      <li><a href="projects.html" class="retro-press">projects</a></li>
      <li><a href="about.html" class="retro-press">about</a></li>
    </ul>
  </nav>

  <main class="project-detail-layout">
    <button onclick="window.history.back()" class="btn-back retro-press">&lt; back</button>
    
    <h1 class="project-title" id="project-title">Loading...</h1>
    
    <div class="project-content-box" id="project-content">
      <!-- Project HTML content from JSON will be injected here -->
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/interactions.js"></script>
  <script src="data/projects.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('id');
      
      if (!projectId) {
        document.getElementById('project-title').textContent = "Project Not Found";
        return;
      }

      const project = siteProjects.find(p => p.id === projectId);
      if (project) {
        document.title = `Zuri Ye - ${project.title}`;
        document.getElementById('project-title').textContent = project.title;
        document.getElementById('project-content').innerHTML = project.content;
      } else {
        document.getElementById('project-title').textContent = "Project Not Found";
      }
    });
  </script>
</body>
</html>
