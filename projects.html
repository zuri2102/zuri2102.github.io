<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    try {
      const linkedTheme = new URLSearchParams(location.search).get('theme');
      const savedTheme = linkedTheme || localStorage.getItem('theme');
      if (linkedTheme) localStorage.setItem('theme', linkedTheme);
      if (savedTheme === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch {}
  </script>
  <title>Zuri Ye - Projects</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <nav class="global-nav">
    <ul class="nav-links">
      <li><a href="index.html" class="retro-press">home</a></li>
      <li><a href="projects.html" class="retro-press">projects</a></li>
      <li><a href="about.html" class="retro-press">about</a></li>
    </ul>
  </nav>

  <main>
    <div class="cartridge-grid" id="projects-grid">
      <!-- Cartridges will be injected here by JS -->
    </div>
  </main>

  <section class="project-overlay" id="project-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="project-detail-layout">
      <button type="button" class="btn-back retro-press" id="project-overlay-back">&lt; back</button>
      <h1 class="project-title" id="project-overlay-title"></h1>
      <div class="project-content-box" id="project-overlay-content"></div>
    </div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/interactions.js"></script>
  <script src="data/projects.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('projects-grid');
      const cLayout = siteConfig.cartridgeLayout || { title: {}, summary: {}, tags: {} };
      const overlay = document.getElementById('project-overlay');
      const overlayBack = document.getElementById('project-overlay-back');
      const overlayTitle = document.getElementById('project-overlay-title');
      const overlayContent = document.getElementById('project-overlay-content');
      const projectsPageTitle = document.title;
      let activeCartridge = null;

      const openProjectOverlay = (project, href, addHistory = true) => {
        activeCartridge = document.activeElement;
        overlayTitle.textContent = project.title;
        overlayContent.innerHTML = project.content;
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.classList.add('project-overlay-open');
        document.title = `Zuri Ye - ${project.title}`;

        if (addHistory) {
          const destination = new URL(href, window.location.href);
          const currentTheme = document.documentElement.dataset.theme === 'dark'
            ? 'dark'
            : 'light';
          destination.searchParams.set('theme', currentTheme);
          history.pushState(
            { projectOverlay: true, projectId: project.id },
            '',
            destination.href
          );
        }

        overlay.scrollTop = 0;
        overlayBack.focus();
      };

      const closeProjectOverlay = () => {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('project-overlay-open');
        document.title = projectsPageTitle;
        activeCartridge?.focus();
      };

      const returnToProjects = () => {
        const destination = new URL('projects.html', window.location.href);
        const currentTheme = document.documentElement.dataset.theme === 'dark'
          ? 'dark'
          : 'light';
        destination.searchParams.set('theme', currentTheme);
        history.replaceState(null, '', destination.href);
        closeProjectOverlay();
      };
      
      siteProjects.forEach(project => {
        const cartridge = document.createElement('a');
        cartridge.href = `project.html?id=${project.id}`;
        cartridge.className = 'cartridge retro-press';
        
        let tagsHtml = project.tags.map(tag => `<span class="tag">${tag}</span>`).join('');

        cartridge.innerHTML = `
          <img src="assets/sprites/cartridge.png" class="cartridge-bg" alt="Cartridge">
          <div class="cartridge-content">
            <h2 class="cartridge-title" style="top: ${cLayout.title.top}; left: ${cLayout.title.left}; transform: ${cLayout.title.transform || 'none'}; width: ${cLayout.title.width};">${project.title}</h2>
            ${project.subheading ? `<div class="cartridge-subheading" style="top: ${cLayout.subheading.top}; left: ${cLayout.subheading.left}; transform: ${cLayout.subheading.transform || 'none'}; width: ${cLayout.subheading.width};">${project.subheading}</div>` : ''}
            <p class="cartridge-summary" style="top: ${cLayout.summary.top}; left: ${cLayout.summary.left}; width: ${cLayout.summary.width};">${project.summary}</p>
            <div class="cartridge-tags" style="bottom: ${cLayout.tags.bottom}; left: ${cLayout.tags.left}; width: ${cLayout.tags.width};">${tagsHtml}</div>
          </div>
        `;

        cartridge.addEventListener('click', event => {
          if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;

          event.preventDefault();
          event.stopPropagation();
          openProjectOverlay(project, cartridge.href);
        });
        
        grid.appendChild(cartridge);
      });

      overlayBack.addEventListener('click', returnToProjects);

      window.addEventListener('popstate', event => {
        if (event.state?.projectOverlay) {
          const project = siteProjects.find(item => item.id === event.state.projectId);
          if (project) openProjectOverlay(project, window.location.href, false);
        } else {
          closeProjectOverlay();
        }
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && overlay.classList.contains('is-open')) {
          returnToProjects();
        }
      });

      // Keep every overlay element at the same scale as its cartridge image.
      const desktopCartridgeWidth = 352;
      const resizeCartridgeContent = cartridge => {
        const content = cartridge.querySelector('.cartridge-content');
        const scale = cartridge.clientWidth / desktopCartridgeWidth;

        content.style.width = `${100 / scale}%`;
        content.style.height = `${100 / scale}%`;
        content.style.transform = `scale(${scale})`;
      };

      const cartridgeObserver = new ResizeObserver(entries => {
        entries.forEach(entry => resizeCartridgeContent(entry.target));
      });

      grid.querySelectorAll('.cartridge').forEach(cartridge => {
        resizeCartridgeContent(cartridge);
        cartridgeObserver.observe(cartridge);
      });
    });
  </script>
</body>
</html>
