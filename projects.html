<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zuri Ye - Projects</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <nav class="global-nav">
    <ul class="nav-links">
      <li><a href="index.html" class="retro-press">home</a></li>
      <li><a href="projects.html" class="retro-press">projects</a></li>
      <li><a href="about.html" class="retro-press">about</a></li>
    </ul>
  </nav>

  <main>
    <div class="cartridge-grid" id="projects-grid">
      <!-- Cartridges will be injected here by JS -->
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/interactions.js"></script>
  <script src="data/projects.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('projects-grid');
      const cLayout = siteConfig.cartridgeLayout || { title: {}, summary: {}, tags: {} };
      
      siteProjects.forEach(project => {
        const cartridge = document.createElement('a');
        cartridge.href = `project.html?id=${project.id}`;
        cartridge.className = 'cartridge retro-press';
        
        let tagsHtml = project.tags.map(tag => `<span class="tag">${tag}</span>`).join('');

        cartridge.innerHTML = `
          <img src="assets/sprites/cartridge.png" class="cartridge-bg" alt="Cartridge">
          <div class="cartridge-content">
            <h2 class="cartridge-title" style="top: ${cLayout.title.top}; left: ${cLayout.title.left}; transform: ${cLayout.title.transform || 'none'}; width: ${cLayout.title.width};">${project.title}</h2>
            ${project.subheading ? `<div class="cartridge-subheading" style="top: ${cLayout.subheading.top}; left: ${cLayout.subheading.left}; transform: ${cLayout.subheading.transform || 'none'}; width: ${cLayout.subheading.width};">${project.subheading}</div>` : ''}
            <p class="cartridge-summary" style="top: ${cLayout.summary.top}; left: ${cLayout.summary.left}; width: ${cLayout.summary.width};">${project.summary}</p>
            <div class="cartridge-tags" style="bottom: ${cLayout.tags.bottom}; left: ${cLayout.tags.left}; width: ${cLayout.tags.width};">${tagsHtml}</div>
          </div>
        `;
        
        grid.appendChild(cartridge);
      });
    });
  </script>
</body>
</html>
